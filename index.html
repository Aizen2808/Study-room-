<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Study Room</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef1f5;color:#172033}.app{max-width:430px;margin:auto;min-height:100vh;background:#fff}header{padding:22px 20px 16px;background:#111827;color:#fff}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}main{padding:18px 16px 90px}.section{display:none}.section.active{display:block}h2{margin:0 0 14px;font-size:21px}.card{border:1px solid #e2e8f0;border-radius:15px;padding:14px;margin:10px 0;background:#fff}.topic{display:flex;justify-content:space-between;align-items:center;gap:10px}.topic small,.card small{display:block;color:#64748b;margin-top:4px}button{border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#e2e8f0;color:#172033}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0;font-size:15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #e2e8f0}.nav button{background:#fff;color:#475569;border-radius:0;padding:13px 4px}.nav button.active{color:#111827;background:#f1f5f9}.msg{padding:10px 12px;background:#f1f5f9;border-radius:13px;margin:8px 0;max-width:85%}.me{margin-left:auto;background:#111827;color:#fff}.meta{font-size:11px;opacity:.65;margin-bottom:3px}.row{display:flex;gap:7px}.row input{margin:0}
</style>
</head>
<body>
<div class="app">
<header><h1>Study Room</h1><p>3-person shared study space • Prototype</p></header>
<main>
<section id="syllabus" class="section active"><h2>📚 Syllabus</h2><div id="topics"></div></section>
<section id="videos" class="section"><h2>🎥 Video Library</h2>
<div class="card"><b>Add a YouTube resource</b><input id="vtitle" placeholder="Video title"><input id="vurl" placeholder="YouTube link"><button onclick="addVideo()">Add video</button></div><div id="videoList"></div></section>
<section id="chat" class="section"><h2>💬 Group Chat</h2><div id="messages"></div><div class="row"><input id="chatInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">Send</button></div></section>
</main>
<nav class="nav"><button class="active" onclick="show('syllabus',this)">📚<br>Syllabus</button><button onclick="show('videos',this)">🎥<br>Videos</button><button onclick="show('chat',this)">💬<br>Chat</button></nav>
</div>
<script>
const topics=[['Number System',false],['Percentage',false],['Profit & Loss',false],['Quadratic Equations',false],['Time & Distance',false],['Geometry',false]];
let videos=[['Quadratic Equations — Lecture 1','https://www.youtube.com/','Aman'],['Number System — Basics','https://www.youtube.com/','You']];
let messages=[['Aman','Check the quadratic equations lecture.','09:12'],['You','I’ll watch it today.','09:15'],['Riya','Send the practice questions too.','09:18']];
function renderTopics(){topicsEl.innerHTML=topics.map((t,i)=>`<div class="card topic"><div class="${t[1]?'done':''}"><b>${t[0]}</b><small>${t[1]?'Completed':'Not started'}</small></div><button class="${t[1]?'secondary':''}" onclick="topics[${i}][1]=!topics[${i}][1];renderTopics()">${t[1]?'Undo':'Done'}</button></div>`).join('')}
function renderVideos(){videoList.innerHTML=videos.map(v=>`<div class="card"><b>${v[0]}</b><small>Added by ${v[2]}</small><br><br><a href="${v[1]}" target="_blank"><button>Open YouTube</button></a></div>`).join('')}
function renderMessages(){messagesEl.innerHTML=messages.map(m=>`<div class="msg ${m[0]==='You'?'me':''}"><div class="meta">${m[0]} • ${m[2]}</div>${m[1]}</div>`).join('')}
function show(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function addVideo(){let t=vtitle.value.trim(),u=vurl.value.trim();if(!t||!u)return;videos.unshift([t,u,'You']);vtitle.value='';vurl.value='';renderVideos()}
function sendMsg(){let x=chatInput.value.trim();if(!x)return;let d=new Date();messages.push(['You',x,d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})]);chatInput.value='';renderMessages()}
const topicsEl=document.getElementById('topics'),videoList=document.getElementById('videoList'),messagesEl=document.getElementById('messages'),vtitle=document.getElementById('vtitle'),vurl=document.getElementById('vurl'),chatInput=document.getElementById('chatInput');renderTopics();renderVideos();renderMessages();
</script>
</body></html>
